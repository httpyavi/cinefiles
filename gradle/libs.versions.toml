[versions]
# WHY SOME VERSIONS LOOK OLD (checked by building, not guessed):
# This project uses Kotlin 1.9.0 and compileSdk 34. That blocks a few newer releases:
#  - needs compileSdk 35 or higher: core-ktx 1.15+, recyclerview 1.4, core-splashscreen 1.2,
#    material 1.14 (it pulls in core 1.16)
#  - built with Kotlin 2.1, so Kotlin 1.9.0 cannot read them: appcompat 1.8, navigation 2.10,
#    lifecycle 2.11, room 2.8
# To use those, upgrade Kotlin (+ the matching KSP) and compileSdk together, as one separate step.
# Do not bump single versions in this file without running a full build.

# Build tools (unchanged from the project template - not upgraded)
agp = "8.6.1"
kotlin = "1.9.0"
# KSP must match the Kotlin version exactly: "<kotlin version>-<ksp version>"
ksp = "1.9.0-1.0.13"

# AndroidX / Material
coreKtx = "1.13.1"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.2"
recyclerview = "1.3.2"
lifecycle = "2.9.0"
navigation = "2.8.9"
splashscreen = "1.0.1"

# Kotlin / data / network / images
coroutines = "1.8.1"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
glide = "4.16.0"

# Tests
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }

androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
